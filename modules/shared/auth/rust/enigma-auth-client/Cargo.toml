[package]
name = "enigma-auth-client"
version = "0.1.0"
edition = "2021"

[features]
default = ["grpc"]
grpc = ["dep:enigma-auth-grpc"]

[dependencies]
enigma-auth = { path = "../enigma-auth" }
enigma-auth-grpc = { path = "../enigma-auth-grpc", optional = true }
tonic = "0.12.3"
uuid = { version = "1.11.0", features = ["v4"] }
