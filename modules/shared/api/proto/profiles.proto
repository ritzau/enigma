syntax = "proto3";

package profiles;

service Profiles {
    rpc CreateProfile (CreateProfileRequest) returns (CreateProfileReply) {}
    rpc DeleteProfile (DeleteProfileRequest) returns (DeleteProfileReply) {}
    rpc GetProfile (GetProfileRequest) returns (GetProfileReply) {}
    rpc UpdateProfile (UpdateProfileRequest) returns (UpdateProfileReply) {}
    rpc GetConnections (GetConnectionsRequest) returns (GetConnectionsReply) {}
    rpc AddConnection (AddConnectionRequest) returns (AddConnectionReply) {}
    rpc RemoveConnection (RemoveConnectionRequest) returns (RemoveConnectionReply) {}
    rpc UpdateConnection (UpdateConnectionRequest) returns (UpdateConnectionReply) {}
}

service Connections {
}

message CreateProfileRequest {
    UserProfile profile = 1;
}

message CreateProfileReply {
}

message DeleteProfileRequest {
    int64 user_id = 1;
}

message DeleteProfileReply {
}

message GetProfileRequest {
    int64 user_id = 1;
}

message GetProfileReply {
    UserProfile profile = 1;
}

message UpdateProfileRequest {
    UserProfile profile = 1;
}

message UpdateProfileReply {
}

message GetConnectionsRequest {
    int64 user_id = 1;
}

message GetConnectionsReply {
    repeated Connection connections = 1;
}

message Connection {
    string kind = 1;
    UserProfile profile = 2;
}

message AddConnectionRequest {
    int64 user_id = 1;
    int64 connection_user_id = 2;
    string kind = 3;
}

message AddConnectionReply {
}

message RemoveConnectionRequest {
    int64 user_id = 1;
    int64 connection_user_id = 2;
}

message RemoveConnectionReply {
}

message UpdateConnectionRequest {
    int64 user_id = 1;
    int64 connection_user_id = 2;
    string kind = 3;
}

message UpdateConnectionReply {
}

message UserProfile {
    int64 user_id = 1;
    string legal_name = 2;
    string display_name = 3;
    string profile_picture_url = 4;
    string primary_email = 5;
    int64 date_of_birth = 6;
}
