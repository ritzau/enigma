[package]
name = "enigma-service"
version = "0.1.0"
edition = "2021"

[dependencies]
enigma-auth-grpc= { path = "../../../../shared/auth/rust/enigma-auth-grpc" }
enigma-auth-service = { path = "../../../../shared/auth/rust/enigma-auth-service", features = ["grpc"] }
enigma-auth= { path = "../../../../shared/auth/rust/enigma-auth" }
http-body = "1.0.1"
http-body-util = "0.1.2"
tokio = { version = "1.43.0", features = ["rt-multi-thread"] }
tonic = "0.12.3"
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = { version = "1.12.0", features = ["v4"] }
