[package]
name = "foorum-client"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.26", features = ["derive"] }
foorum-auth = { path = "../foorum-auth" }
foorum-auth-client-grpc = { path = "../foorum-auth-client-grpc" }
tokio = { version = "1.43.0", features = ["rt-multi-thread"] }
uuid = { version = "1.11.1", features = ["v4"] }
